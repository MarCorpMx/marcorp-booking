<div class="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">

    <!-- HEADER -->
    <!--<div>
    <h2 class="text-2xl font-bold text-slate-900">
      Fecha y hora
    </h2>

    <p class="text-slate-500">
      ¿Cuándo te gustaría venir?
    </p>
  </div>-->

    <!-- DATE SELECTOR -->
    <div *ngIf="loadingDays" class="flex gap-2 overflow-x-auto pb-2">

        <div *ngFor="let i of [1,2,3,4,5,6,7,8,9]" class="min-w-[70px] h-[60px] rounded-2xl bg-slate-200 animate-pulse">
        </div>

    </div>
    <div *ngIf="!loadingDays" class="flex gap-2 overflow-x-auto pb-2">

        <!--<button *ngFor="let day of days" (click)="selectDate(day)"
            class="flex flex-col items-center min-w-[70px] p-3 rounded-2xl border-2 transition-all cursor-pointer"
            [ngClass]="{
        'border-[var(--brand-primary)] bg-[var(--brand-primary)] text-white shadow-lg shadow-[var(--brand-primary)]':
          isSelectedDate(day),
        'border-white bg-white hover:border-slate-200 text-slate-600 shadow-sm':
          !isSelectedDate(day),
          'opacity-40 pointer-events-none': times.length === 0 && isSelectedDate(day)
      }">-->

        <button *ngFor="let day of days" (click)="selectDate(day)" [disabled]="!isDayAvailable(day)"
            class="flex flex-col items-center min-w-[70px] p-3 rounded-2xl border-2 transition-all" [ngClass]="{

  'border-[var(--brand-primary)] bg-[var(--brand-primary)] text-white shadow-lg cursor-pointer':
      isSelectedDate(day),

  'border-white bg-white hover:border-slate-200 text-slate-600 shadow-sm cursor-pointer':
      !isSelectedDate(day) && isDayAvailable(day),

  'opacity-40 cursor-not-allowed bg-slate-50':
      !isDayAvailable(day)

}">

            <span class="text-[10px] uppercase font-bold tracking-wider opacity-80">
                {{ day | date:'EEE' }}
            </span>

            <span class="text-lg font-black mt-1">
                {{ day | date:'d' }}
            </span>

        </button>

    </div>

    <!-- TIME GRID -->
    <div *ngIf="loadingTimes || loadingDays" class="grid grid-cols-3 sm:grid-cols-4 gap-2">

        <div *ngFor="let i of [1,2,3,4,5,6]" class="h-[44px] rounded-xl bg-slate-200 animate-pulse">
        </div>

    </div>
    <div *ngIf="!loadingTimes && times.length > 0 && !loadingDays" class="grid grid-cols-3 sm:grid-cols-4 gap-2">

        <button *ngFor="let slot of times" (click)="selectTime(slot)" class="p-3 text-sm font-bold rounded-xl border-2 border-white bg-white
             hover:border-[var(--brand-primary)] hover:text-[var(--brand-primary)]
             transition-all shadow-sm cursor-pointer" [ngClass]="{
  'border-[var(--brand-primary)] text-[var(--brand-primary)]': selectedTime === slot.time,
  'border-white': selectedTime !== slot.time
}">

            {{ slot.time }}

        </button>

    </div>

    <!-- NO AVAILABILITY -->
    <div *ngIf="!loadingTimes && times.length === 0" class="text-center py-8 text-slate-500 text-sm">
        No hay horarios disponibles para este día
    </div>

</div>
