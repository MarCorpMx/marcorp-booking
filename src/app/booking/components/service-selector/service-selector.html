<div class="space-y-4">

    @for (service of services; track service.id) {

    <div class="border rounded-2xl overflow-hidden
              bg-white shadow-sm
              border-gray-200
              transition-all duration-200
              hover:shadow-md">

        <!-- SERVICE HEADER -->
        <div (click)="toggleService(service.id)" class="p-5 cursor-pointer flex justify-between items-center
             transition group hover:bg-gray-50">

            <div>

                <h3 class="font-bold text-slate-900
                   group-hover:text-[var(--brand-primary)]
                   transition-colors">
                    {{ service.name }}
                </h3>

                <p *ngIf="service.description" class="text-sm text-slate-500 mt-1">
                    {{ service.description }}
                </p>

            </div>

            <!-- CHEVRON -->
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400 transition-transform duration-200"
                [class.rotate-180]="expandedIndex === service.id" fill="none" viewBox="0 0 24 24" stroke="currentColor">

                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>

        </div>

        <!-- VARIANTS -->
        <div *ngIf="expandedIndex === service.id"
            class="border-t bg-slate-50 animate-in fade-in slide-in-from-top-2 duration-300">

            <div *ngFor="let variant of service.variants" (click)="selectVariant(service, variant)" class="flex justify-between items-center
                  p-4 border-b last:border-b-0
                  cursor-pointer transition
                  group
                  hover:bg-white
                  hover:shadow-sm" [ngClass]="{
           'bg-[var(--brand-primary)]/5 border-l-4 border-[var(--brand-primary)]':
           selectedVariantId === variant.id
           }">

                <div>

                    <div class="font-medium text-slate-900
                      group-hover:text-[var(--brand-primary)] transition">
                        {{ variant.name }}
                    </div>

                    <!-- BADGES  -->
                    <div class="flex items-center gap-2 mt-1">

                        <span class="text-xs font-medium
                         text-slate-600
                         bg-slate-200
                         px-2 py-1
                         rounded-lg">

                            ⏱ {{ variant.duration_minutes }} min

                        </span>

                        @if (variant.mode && variant.mode !== 'hybrid') {

                        <span class="text-xs font-medium
                 text-[var(--brand-primary)]
                 bg-blue-100
                 px-2 py-1
                 rounded-lg">

                            {{ getModeLabel(variant.mode) }}

                        </span>

                        }

                    </div>

                    <!-- HYBRID SELECTOR -->
                   <!-- @if (selectedVariantId === variant.id && variant.mode === 'hybrid') {

                    <div class="flex flex-wrap gap-2 mt-3">

                        <button (click)="variantSelected.emit({service, variant, mode:'presential'})" class="px-3 py-1 rounded-lg
                   bg-slate-200 hover:bg-slate-300
                   text-sm cursor-pointer
                   transition">

                            🏢 Presencial

                        </button>

                        <button (click)="variantSelected.emit({service, variant, mode:'online'})" class="px-3 py-1 rounded-lg
                   bg-slate-200 hover:bg-slate-300
                   text-sm cursor-pointer
                   transition">

                            💻 En línea

                        </button>

                    </div>

                    }-->

                </div>

                <!-- price -->
                <div class="text-sm font-bold text-[var(--brand-primary)]">

                    ${{ variant.price | number:'1.0-0' }}

                </div>

            </div>

        </div>

    </div>

    }

</div>
