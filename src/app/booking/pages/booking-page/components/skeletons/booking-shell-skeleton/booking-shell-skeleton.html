<div class="min-h-screen flex flex-col animate-pulse">

    <!-- HEADER -->
    <header class="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">

        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">

            <div class="flex items-center gap-3">

                <!-- logo -->
                <div class="w-14 h-14 rounded-xl bg-slate-200"></div>

                <div>

                    <div class="h-4 w-40 rounded bg-slate-200"></div>

                    <div class="flex gap-2 mt-2">

                        <div class="h-3 w-20 rounded bg-slate-100"></div>

                        <div class="h-3 w-24 rounded bg-slate-100"></div>

                    </div>

                </div>

            </div>

            <!-- desktop text -->
            <div class="hidden md:flex flex-col items-end gap-2">

                <div class="h-3 w-48 rounded bg-slate-100"></div>

                <div class="h-3 w-32 rounded bg-slate-100"></div>

            </div>

        </div>

    </header>


    <!-- mobile text -->
    <div class="md:hidden px-4 pt-3 pb-2 space-y-2">

        <div class="h-3 w-40 rounded bg-slate-100"></div>

        <div class="h-3 w-28 rounded bg-slate-100"></div>

    </div>


    <!-- MAIN -->
    <main class="flex-1 max-w-6xl mx-auto w-full px-4 py-8">

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">

            <!-- LEFT -->
            <div class="lg:col-span-8 space-y-10">


                <!-- STEPPER -->
                <div class="flex items-center gap-3 mb-2">

                    <div class="w-8 h-8 rounded-full bg-slate-200"></div>

                    <div class="flex-1 h-1 rounded bg-slate-100"></div>

                    <div class="w-8 h-8 rounded-full bg-slate-100"></div>

                    <div class="flex-1 h-1 rounded bg-slate-100"></div>

                    <div class="w-8 h-8 rounded-full bg-slate-100"></div>

                </div>


                <!-- STEP TITLE -->
                <div class="space-y-4">

                    <div class="h-5 w-52 rounded bg-slate-200"></div>


                    <!-- SERVICES -->
                    @for(item of [1,2,3]; track item){

                    <div class="rounded-2xl border border-slate-100 bg-white p-5">

                        <div class="flex justify-between items-start">

                            <div class="space-y-3 flex-1">

                                <div class="h-4 w-40 rounded bg-slate-200"></div>

                                <div class="h-3 w-64 rounded bg-slate-100"></div>

                                <div class="h-3 w-32 rounded bg-slate-100"></div>

                            </div>

                            <div class="w-20 h-8 rounded-xl bg-slate-100"></div>

                        </div>

                    </div>

                    }

                </div>


                <!-- FAKE NEXT SECTION PREVIEW -->
                <div class="pt-6 border-t border-slate-100 space-y-4">

                    <div class="h-5 w-56 rounded bg-slate-100"></div>

                    <div class="grid grid-cols-4 gap-3">

                        @for(day of [1,2,3,4]; track day){

                        <div class="h-16 rounded-xl bg-slate-100"></div>

                        }

                    </div>

                </div>

            </div>


            <!-- RIGHT SUMMARY -->
            <aside class="hidden lg:block lg:col-span-4">

                <div class="rounded-3xl border border-slate-100 bg-white p-6 space-y-5">

                    <div class="h-5 w-32 rounded bg-slate-200"></div>

                    <div class="space-y-3">

                        <div class="h-4 rounded bg-slate-100"></div>

                        <div class="h-4 rounded bg-slate-100 w-4/5"></div>

                        <div class="h-4 rounded bg-slate-100 w-3/5"></div>

                    </div>

                    <div class="pt-4 border-t border-slate-100 space-y-3">

                        <div class="h-3 rounded bg-slate-100"></div>

                        <div class="h-3 rounded bg-slate-100 w-5/6"></div>

                    </div>

                    <div class="h-12 rounded-2xl bg-slate-200 mt-4"></div>

                </div>

            </aside>

        </div>

    </main>

</div>
