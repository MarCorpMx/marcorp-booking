<div class="min-h-screen flex flex-col bg-slate-50 animate-pulse">

    <!-- HEADER -->
    <header class="sticky top-0 bg-white border-b border-slate-100">

        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-3">

            <!-- logo -->
            <div class="w-10 h-10 rounded-xl bg-slate-200 shrink-0"></div>

            <!-- textos -->
            <div class="flex-1">

                <div class="h-3 w-36 rounded bg-slate-200"></div>

                <div class="h-3 w-24 rounded bg-slate-100 mt-2"></div>

                <div class="h-2 w-44 rounded bg-slate-100 mt-2"></div>

            </div>

            <!-- badge -->
            <div class="hidden sm:block h-7 w-24 rounded-full bg-slate-100"></div>

        </div>

    </header>

    <!-- CONTENT -->
    <main class="flex-1 px-4 pt-12">

        <div class="max-w-md mx-auto">

            <div class="bg-white rounded-2xl shadow-[0_20px_60px_rgba(0,0,0,.08)] p-8">

                <!-- icon -->
                <div class="flex justify-center mb-6">

                    <div class="w-22 h-22 rounded-full bg-slate-100 flex items-center justify-center">

                        <div class="w-10 h-10 rounded-full bg-slate-200"></div>

                    </div>

                </div>

                <!-- title -->
                <div class="h-6 w-56 rounded bg-slate-200 mx-auto mb-4"></div>

                <!-- message -->
                <div class="space-y-3 mb-6">

                    <div class="h-3 rounded bg-slate-100"></div>

                    <div class="h-3 w-5/6 rounded bg-slate-100 mx-auto"></div>

                </div>

                <!-- secure text -->
                <div class="h-3 w-40 rounded bg-slate-100 mx-auto mb-6"></div>

                <!-- divider -->
                <div class="border-t border-slate-100 pt-5 space-y-3 mb-6">

                    <div class="h-4 w-40 rounded bg-slate-200 mx-auto"></div>

                    <div class="h-3 w-36 rounded bg-slate-100 mx-auto"></div>

                    <div class="h-3 w-24 rounded bg-slate-100 mx-auto"></div>

                </div>

                <!-- buttons -->
                <div class="space-y-3">

                    <div class="h-11 rounded-xl bg-slate-200"></div>

                    <div class="h-11 rounded-xl bg-slate-100"></div>

                </div>

            </div>

        </div>

    </main>

</div>
